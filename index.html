<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MUGEN Web Fighter - 2D Fighting Game" />
    <title>MUGEN Web Fighter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: #05050a;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Press Start 2P', monospace;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      #menu-video-bg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        pointer-events: none;
        z-index: 1;
        display: none;
      }
      /* Phaser's FIT scale mode sizes the canvas to the window (or the whole screen in
         fullscreen) keeping 16:9; the container letterboxes the rest in black. */
      #game-container:fullscreen,
      #game-container:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      canvas {
        position: relative;
        z-index: 2;
        display: block;
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <video id="menu-video-bg" src="/assets/menu/MENU%20VIDEO.mp4" loop muted playsinline preload="none"></video>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
